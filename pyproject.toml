[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "group-discount-optimization"
version = "0.3.0"
description = "Research project for cardinality-constrained single-knapsack optimization with group-specific coefficients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research prototype; license to be selected before publication" }
authors = [{ name = "Alexander Nesterov" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
